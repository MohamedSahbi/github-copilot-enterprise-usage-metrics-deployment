# Azure Pipelines: data operations on an environment's portal database, separate from the deploy pipeline.
# Nothing triggers it: queue it by hand and pick an operation. Register it as its own pipeline.
# This file only points at the pipeline in the deployment template repository and sets your values; the stages, steps
# and checks are loaded from there at run time, so a deployment repository never carries its own copy of them.
# Settings to replace are marked REPLACE (the same values as azure-pipelines.yml, plus a GitHub service connection).
trigger: none
pr: none

resources:
  repositories:
    - repository: template
      type: github
      # Azure DevOps service connection of type "GitHub" that can read the public template repository
      # (docs/getting-started.md, "Loading the pipelines from this template"; it also covers running without one).
      endpoint: REPLACE-github-service-connection-name
      name: MohamedSahbi/github-copilot-enterprise-usage-metrics-deployment
      # Follows the template's main branch. Pin a tag or commit (refs/tags/<tag>) to hold a reviewed version.
      ref: refs/heads/main

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values: [dev, test, prod]
  - name: operation
    displayName: Operation
    type: string
    default: status
    values: [status, remove-synthetic, remove-synthetic-execute]
  - name: fromDay
    displayName: First day for status (yyyy-mm-dd)
    type: string
    default: "2026-09-01"
  - name: expectFactRows
    displayName: Fact rows from the dry run (remove-synthetic-execute only)
    type: string
    default: "-"

variables:
  # Azure DevOps service connection of type "Azure Resource Manager" using workload identity federation (no secret).
  # Its identity must be in the SQL server's Entra admin group.
  azureServiceConnection: REPLACE-service-connection-name
  # Output of the portal's scripts/bootstrap-state.sh.
  TFSTATE_RESOURCE_GROUP: REPLACE-state-resource-group
  TFSTATE_STORAGE_ACCOUNT: REPLACE-state-storage-account
  # Microsoft-hosted agents do not ship Terraform. The portal needs 1.11 or newer.
  terraformVersion: 1.17.0

pool:
  vmImage: ubuntu-latest

extends:
  template: azure-pipelines/data-operations.yml@template
  parameters:
    environment: ${{ parameters.environment }}
    operation: ${{ parameters.operation }}
    fromDay: ${{ parameters.fromDay }}
    expectFactRows: ${{ parameters.expectFactRows }}
