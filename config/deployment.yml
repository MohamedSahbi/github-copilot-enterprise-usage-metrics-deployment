# Settings read by the deploy pipeline itself. Anything Terraform or the portal reads belongs in config/<environment>.tfvars.
portal:
  # Change the repository only if you consume your own fork of the portal.
  repository: MohamedSahbi/github-copilot-enterprise-usage-metrics
  # A released portal version, for example 0.1.0. Use 0.2.5 or later: the pipelines call the step-based deploy script.
  version: 0.2.5
