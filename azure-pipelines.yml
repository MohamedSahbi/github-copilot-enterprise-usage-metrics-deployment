# Azure Pipelines wrapper. All logic lives in the portal's scripts/deploy-infra.sh; this file only prepares inputs.
# Run it manually (no CI trigger). Settings to replace are marked REPLACE.
# The stages and steps are loaded at run time from azure-pipelines/deploy.yml in the deployment template repository,
# so a deployment repository keeps only this file's values and its config/, never a copy of the pipeline.
trigger: none
pr: none

resources:
  repositories:
    - repository: template
      type: github
      # Azure DevOps service connection of type "GitHub" that can read the public template repository.
      endpoint: REPLACE-github-service-connection-name
      name: MohamedSahbi/github-copilot-enterprise-usage-metrics-deployment
      # Follows the template's main branch. Pin a tag or commit (refs/tags/<tag>) to hold a reviewed version.
      ref: refs/heads/main

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values: [dev, test, prod]
  - name: apply
    displayName: Apply the reviewed plan after approval (otherwise plan only)
    type: boolean
    default: false
  - name: deployPortal
    displayName: Deploy the portal code after the apply (needs apply)
    type: boolean
    default: false
  - name: deployFunctions
    displayName: Deploy the ingestion Function Apps code after the apply (needs apply)
    type: boolean
    default: false

variables:
  # Azure DevOps service connection of type "Azure Resource Manager" using workload identity federation (no secret).
  azureServiceConnection: REPLACE-service-connection-name
  # Output of the portal's scripts/bootstrap-state.sh.
  TFSTATE_RESOURCE_GROUP: REPLACE-state-resource-group
  TFSTATE_STORAGE_ACCOUNT: REPLACE-state-storage-account
  # Microsoft-hosted agents do not ship Terraform. The portal needs 1.11 or newer.
  terraformVersion: 1.17.0

pool:
  vmImage: ubuntu-latest

extends:
  template: azure-pipelines/deploy.yml@template
  parameters:
    environment: ${{ parameters.environment }}
    apply: ${{ parameters.apply }}
    deployPortal: ${{ parameters.deployPortal }}
    deployFunctions: ${{ parameters.deployFunctions }}
